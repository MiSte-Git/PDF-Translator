# Builds the guided-installer ("Bootstrapper") executable for Linux,
# Windows, and macOS, and - on a version tag - publishes them together
# with a plain source-code ZIP as a GitHub Release.
#
# Why there is no separate "build the real app" job: the bootstrapper
# (bootstrap/) does not freeze the real app into an executable at all - it
# creates a per-user venv and `pip install`s requirements*.txt into it (see
# bootstrap/installer.py), then points a desktop launcher entry straight at
# that venv's own python -m ui.app (bootstrap/desktop_integration.py). The
# only thing Stage 2 needs from GitHub is the plain source code, which the
# build-source-archive job below produces with a plain `git archive` - no
# PyInstaller build for it, on any platform. See the "Architektur"/
# "App-Code-Quelle" sections of the 01.09.2026 project doc
# ("deployment-strategie-bootstrapper-01-09-2026.md") for the full
# rationale, and bootstrap/release_source.py for the download/extract side
# of this.
#
# Builds are unsigned for now (project doc "deployment-strategie-
# 27-08-2026.md": signing is a deliberately deferred follow-up, not part of
# this round) - Windows SmartScreen and macOS Gatekeeper will warn on first
# run until that follow-up happens.
name: Build bootstrapper

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          # icon_arg: PyInstaller embeds an executable icon on Windows
          # (.ico) and macOS (.icns) only; Linux binaries have no such
          # slot, the .desktop entry carries the icon there instead.
          #
          # python_triple: platform triple used to pick the right
          # python-build-standalone "install_only" asset for the bundled
          # Python runtime (see "Download bundled Python runtime" step and
          # bootstrap/bundled_python.py's module docstring - 04.09.2026
          # Windows test-run fix). macos-latest is an Apple Silicon
          # (arm64) runner, hence aarch64 rather than x86_64 there.
          #
          # add_data_sep: PyInstaller's --add-data separates SRC from DEST
          # with ":" on Linux/macOS but requires ";" on Windows (":" there
          # collides with drive letters, e.g. "C:").
          - os: ubuntu-latest
            asset_name: pdf-translator-setup-linux
            dist_name: pdf-translator-setup
            icon_arg: ""
            python_triple: x86_64-unknown-linux-gnu
            add_data_sep: ":"
          - os: windows-latest
            asset_name: pdf-translator-setup-windows.exe
            dist_name: pdf-translator-setup.exe
            icon_arg: "--icon assets/icon.ico"
            python_triple: x86_64-pc-windows-msvc
            add_data_sep: ";"
          - os: macos-latest
            asset_name: pdf-translator-setup-macos
            dist_name: pdf-translator-setup
            icon_arg: "--icon assets/icon.icns"
            python_triple: aarch64-apple-darwin
            add_data_sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # actions/setup-python's Linux builds do not reliably include Tk
      # bindings; python.org's own Windows/macOS installers (what
      # setup-python uses on those runners) already bundle Tcl/Tk, so this
      # step is Linux-only.
      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # Cheap, cross-platform sanity check before spending time on a full
      # PyInstaller build: catches ordinary Python-level import errors in
      # bootstrap/ (missing symbol, typo, syntax) on every OS. Needs no
      # display since it only imports the module, it does not instantiate
      # a Tk() root.
      - name: Import smoke check
        run: python -c "import bootstrap.app"

      # 04.09.2026 (first real Windows test run, project doc
      # "windows-testlauf-04-09-2026.md"): a frozen bootstrapper has no
      # real Python interpreter of its own (sys.executable is the .exe
      # itself) - venv creation failed with WinError 2 on a clean test
      # machine with no system Python installed, which is the expected
      # case for this project's target audience, not an edge case. Fixed
      # by bundling a redistributable CPython (python-build-standalone,
      # same project uv/rye use) into the executable and always creating
      # the Stage-2 venv from THAT interpreter - see
      # bootstrap/bundled_python.py and bootstrap/installer.py::
      # create_venv()/_base_python(). Downloaded from the latest
      # python-build-standalone release rather than a pinned URL so this
      # step keeps working as that project cuts new releases.
      - name: Download bundled Python runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import sys
          import tarfile
          import urllib.request

          triple = "${{ matrix.python_triple }}"
          request = urllib.request.Request(
              "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest",
              headers={"User-Agent": "pdf-translator-build", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          # Prefer "install_only_stripped" (debug symbols stripped, notably
          # smaller) when this release has one for our triple; fall back to
          # plain "install_only" for older releases/triples without it.
          variants = ["install_only_stripped", "install_only"]
          patterns = [
              re.compile(r"^cpython-3\.13\.\d+\+\d+-" + re.escape(triple) + r"-" + variant + r"\.tar\.gz$")
              for variant in variants
          ]
          asset = next(
              (a for pattern in patterns for a in assets if pattern.match(a["name"])), None
          )
          if asset is None:
              candidates = "\n".join(a["name"] for a in assets if triple in a["name"])
              sys.exit(
                  f"No install_only(_stripped) CPython 3.13 asset found for {triple} in "
                  f"astral-sh/python-build-standalone's latest release. "
                  f"Candidates containing that triple:\n{candidates}"
              )

          print(f"Downloading {asset['name']} ({asset.get('size', 0) / 1_000_000:.1f} MB)")
          archive = pathlib.Path("python-runtime.tar.gz")
          urllib.request.urlretrieve(asset["browser_download_url"], archive)

          with tarfile.open(archive) as tf:
              tf.extractall(".")
          archive.unlink()
          pathlib.Path("python").rename("python_runtime")
          print("Bundled Python runtime ready at python_runtime/")
          PY

      - name: Build bootstrapper executable
        run: >
          pyinstaller --onefile --windowed --name pdf-translator-setup
          ${{ matrix.icon_arg }}
          --add-data "python_runtime${{ matrix.add_data_sep }}python_runtime"
          bootstrap/__main__.py

      # Frozen-binary launch smoke test: starts the actual built
      # executable, gives it a couple of seconds to open its first window
      # without crashing, then kills it - proves the PyInstaller bundle
      # itself (not just the source) is intact. Linux-only because a
      # virtual framebuffer (Xvfb) is trivial to set up there; the Windows
      # and macOS runners have no equivalent reliably available, so those
      # two platforms rely on the import smoke check above plus manual
      # verification of the downloaded artifact.
      - name: Frozen-binary launch smoke test (Linux only)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/pdf-translator-setup &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Bootstrapper exited within 3s of starting - treating as a build failure."
            exit 1
          fi
          kill "$pid"

      - name: Stage renamed artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.dist_name }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  build-source-archive:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 01.09.2026: fails the whole release BEFORE anything is built/
      # published if the pushed tag and _version.py's __version__ disagree -
      # see _version.py's module docstring for why these two must never
      # silently drift apart (bootstrap/release_source.py's self-update
      # check keys off the tag via the GitHub API, ui/app.py compares
      # itself against __version__ - a release where they don't match would
      # either never show up as an update to existing installs, or show up
      # as one forever).
      - name: Verify tag matches _version.py
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(python -c 'from _version import __version__; print(__version__)')"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag v$tag_version does not match _version.py's __version__ ($file_version) - bump _version.py and re-tag."
            exit 1
          fi

      - name: Build app source archive
        run: git archive --format=zip --output=pdf-translator-app-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-translator-app-source
          path: pdf-translator-app-source.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-bootstrap, build-source-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # Both bootstrap/release_source.py::resolve_zip_asset_url()
          # (which grabs the first .zip asset) and a human downloading the
          # right file by name depend on there being exactly one .zip
          # asset per release - keep it that way if this job is ever
          # changed.
          fail_on_unmatched_files: true
