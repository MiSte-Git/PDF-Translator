# Builds the guided-installer ("Bootstrapper") executable for Linux,
# Windows, and macOS, and - on a version tag - publishes them together
# with a plain source-code ZIP as a GitHub Release.
#
# Why there is no separate "build the real app" job: the bootstrapper
# (bootstrap/) does not freeze the real app into an executable at all - it
# creates a per-user venv and `pip install`s requirements*.txt into it (see
# bootstrap/installer.py), then points a desktop launcher entry straight at
# that venv's own python -m ui.app (bootstrap/desktop_integration.py). The
# only thing Stage 2 needs from GitHub is the plain source code, which the
# build-source-archive job below produces with a plain `git archive` - no
# PyInstaller build for it, on any platform. See the "Architektur"/
# "App-Code-Quelle" sections of the 01.09.2026 project doc
# ("deployment-strategie-bootstrapper-01-09-2026.md") for the full
# rationale, and bootstrap/release_source.py for the download/extract side
# of this.
#
# Builds are unsigned for now (project doc "deployment-strategie-
# 27-08-2026.md": signing is a deliberately deferred follow-up, not part of
# this round) - Windows SmartScreen and macOS Gatekeeper will warn on first
# run until that follow-up happens.
name: Build bootstrapper

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          # icon_arg: PyInstaller embeds an executable icon on Windows
          # (.ico) and macOS (.icns) only; Linux binaries have no such
          # slot, the .desktop entry carries the icon there instead.
          #
          # python_triple: platform triple used to pick the right
          # python-build-standalone "install_only" asset for the bundled
          # Python runtime (see "Download bundled Python runtime" step and
          # bootstrap/bundled_python.py's module docstring - 04.09.2026
          # Windows test-run fix). macos-latest is an Apple Silicon
          # (arm64) runner, hence aarch64 rather than x86_64 there.
          #
          # add_data_sep: PyInstaller's --add-data separates SRC from DEST
          # with ":" on Linux/macOS but requires ";" on Windows (":" there
          # collides with drive letters, e.g. "C:").
          - os: ubuntu-latest
            asset_name: pdf-translator-setup-linux
            dist_name: pdf-translator-setup
            icon_arg: ""
            python_triple: x86_64-unknown-linux-gnu
            add_data_sep: ":"
          - os: windows-latest
            asset_name: pdf-translator-setup-windows.exe
            dist_name: pdf-translator-setup.exe
            icon_arg: "--icon assets/icon.ico"
            python_triple: x86_64-pc-windows-msvc
            add_data_sep: ";"
          - os: macos-latest
            asset_name: pdf-translator-setup-macos
            dist_name: pdf-translator-setup
            icon_arg: "--icon assets/icon.icns"
            python_triple: aarch64-apple-darwin
            add_data_sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # actions/setup-python's Linux builds do not reliably include Tk
      # bindings; python.org's own Windows/macOS installers (what
      # setup-python uses on those runners) already bundle Tcl/Tk, so this
      # step is Linux-only.
      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # Cheap, cross-platform sanity check before spending time on a full
      # PyInstaller build: catches ordinary Python-level import errors in
      # bootstrap/ (missing symbol, typo, syntax) on every OS. Needs no
      # display since it only imports the module, it does not instantiate
      # a Tk() root.
      - name: Import smoke check
        run: python -c "import bootstrap.app"

      # 04.09.2026 - diagnostic added after the Tcl/Tk version-conflict
      # fixes below (TCL_LIBRARY/TK_LIBRARY pin, Strawberry Perl PATH
      # filter) did NOT stop the crash from recurring on a real Windows
      # VM, even though this same job's own smoke test (further down)
      # kept passing. Both of those earlier fixes assumed the mismatch
      # was introduced by PyInstaller picking up files from two different
      # sources while bundling - but that was never actually verified,
      # just inferred from the error message shape. This step checks the
      # much more basic possibility first: is actions/setup-python's OWN,
      # completely unfrozen Python on this runner already internally
      # inconsistent (its tcl86t.dll reporting a different patch level
      # than its own tcl8.6/init.tcl expects) before PyInstaller ever
      # touches it? If this step fails, the bug is upstream of anything
      # in this workflow (wrong fix: chase PyInstaller bundling further;
      # right fix: pin a different Python 3.13.x patch version above). If
      # it passes, the inconsistency is proven to be introduced during
      # the freeze, which points back at PyInstaller's hook-_tkinter.py.
      - name: Verify the just-installed Python's own Tcl/Tk is self-consistent (Windows only)
        if: runner.os == 'Windows'
        run: |
          python -c "import tkinter; r = tkinter.Tk(); v = r.tk.call('info', 'patchlevel'); print(f'tkinter.Tk() OK - unfrozen Tcl patchlevel: {v}'); r.destroy()"

      # 04.09.2026 (first real Windows test run, project doc
      # "windows-testlauf-04-09-2026.md"): a frozen bootstrapper has no
      # real Python interpreter of its own (sys.executable is the .exe
      # itself) - venv creation failed with WinError 2 on a clean test
      # machine with no system Python installed, which is the expected
      # case for this project's target audience, not an edge case. Fixed
      # by bundling a redistributable CPython (python-build-standalone,
      # same project uv/rye use) into the executable and always creating
      # the Stage-2 venv from THAT interpreter - see
      # bootstrap/bundled_python.py and bootstrap/installer.py::
      # create_venv()/_base_python(). Downloaded from the latest
      # python-build-standalone release rather than a pinned URL so this
      # step keeps working as that project cuts new releases.
      # 04.09.2026 (v0.5.0 release run: "HTTP Error 403: rate limit
      # exceeded" fetching the astral-sh/python-build-standalone metadata
      # below, on all three matrix legs) - api.github.com rate-limits
      # UNAUTHENTICATED requests to 60/hour per source IP, and
      # GitHub-hosted runners share IP pools that are frequently already
      # close to that limit from OTHER workflows worldwide; three matrix
      # legs firing the same request within seconds of each other made
      # this trivial to hit. Authenticating with the run's own
      # GITHUB_TOKEN (automatically provided, no secret to configure)
      # raises the same limit to 5000/hour per token - this is the
      # standard fix, not a workaround. Unrelated to
      # bootstrap/release_source.py's own unauthenticated GitHub API
      # calls: those run on an end user's machine post-install, where
      # there is no GITHUB_TOKEN to use and a single person's occasional
      # requests don't come close to 60/hour.
      - name: Download bundled Python runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import tarfile
          import time
          import urllib.error
          import urllib.request

          triple = "${{ matrix.python_triple }}"
          headers = {"User-Agent": "pdf-translator-build", "Accept": "application/vnd.github+json"}
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          # Small retry with backoff: the rate-limit fix above should make
          # this unnecessary in practice, but a release build failing on a
          # single transient GitHub hiccup (this step gates all three
          # platform builds) is expensive enough to retry a few times for.
          request = urllib.request.Request(
              "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest",
              headers=headers,
          )
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      release = json.load(response)
                  break
              except (urllib.error.URLError, TimeoutError) as exc:
                  if attempt == 2:
                      hint = (
                          " (still rate-limited even with GITHUB_TOKEN - unusual, check "
                          "https://api.github.com/rate_limit)"
                          if isinstance(exc, urllib.error.HTTPError) and exc.code == 403
                          else ""
                      )
                      sys.exit(f"Could not reach GitHub after 3 attempts: {exc}{hint}")
                  time.sleep(2 ** attempt)

          assets = release.get("assets", [])
          # Prefer "install_only_stripped" (debug symbols stripped, notably
          # smaller) when this release has one for our triple; fall back to
          # plain "install_only" for older releases/triples without it.
          variants = ["install_only_stripped", "install_only"]
          patterns = [
              re.compile(r"^cpython-3\.13\.\d+\+\d+-" + re.escape(triple) + r"-" + variant + r"\.tar\.gz$")
              for variant in variants
          ]
          asset = next(
              (a for pattern in patterns for a in assets if pattern.match(a["name"])), None
          )
          if asset is None:
              candidates = "\n".join(a["name"] for a in assets if triple in a["name"])
              sys.exit(
                  f"No install_only(_stripped) CPython 3.13 asset found for {triple} in "
                  f"astral-sh/python-build-standalone's latest release. "
                  f"Candidates containing that triple:\n{candidates}"
              )

          print(f"Downloading {asset['name']} ({asset.get('size', 0) / 1_000_000:.1f} MB)")
          archive = pathlib.Path("python-runtime.tar.gz")
          urllib.request.urlretrieve(asset["browser_download_url"], archive)

          with tarfile.open(archive) as tf:
              tf.extractall(".")
          archive.unlink()
          pathlib.Path("python").rename("python_runtime")
          print("Bundled Python runtime ready at python_runtime/")
          PY

      # 04.09.2026 (second real Windows test run: frozen .exe crashed
      # immediately with "_tkinter.TclError: ... version conflict for
      # package "Tcl": have 8.6.12, need exactly 8.6.15" the moment
      # bootstrap/app.py's BootstrapApp(tk.Tk) opened its first window -
      # see project doc "windows-testlauf-04-09-2026.md" for the first
      # (unrelated) Windows bug found the same day). Root cause:
      # windows-latest ships Strawberry Perl preinstalled (for its own
      # Perl/Tk support), WITH ITS OWN Tcl 8.6.12 on PATH - and
      # PyInstaller resolves what to bundle for tkinter through TWO
      # independent, easily-mismatched paths: (1) the Tcl/Tk SCRIPT
      # library (init.tcl etc.) via its hook-_tkinter.py, which reads the
      # TCL_LIBRARY/TK_LIBRARY env vars first and only auto-discovers when
      # they are unset; (2) the Tcl/Tk DLLs (tcl86t.dll/tk86t.dll) that
      # _tkinter.pyd depends on, resolved via a Windows DLL search that
      # walks PATH - so even with TCL_LIBRARY/TK_LIBRARY correctly pinned
      # to Python's own 8.6.15 SCRIPTS (first attempted fix, insufficient
      # on its own - same error persisted on retest), Strawberry's
      # tcl86t.dll could still win the DLL search if its directory sorts
      # earlier on PATH, bundling an 8.6.12 DLL next to 8.6.15 scripts (or
      # vice versa - either mismatch direction produces the exact same
      # "version conflict" error). Fixing this at the source instead of
      # chasing each individual lookup mechanism: strip every
      # Strawberry-Perl directory out of PATH for the rest of this job,
      # in addition to keeping the TCL_LIBRARY/TK_LIBRARY pin (belt and
      # suspenders - the pin still matters for hook-_tkinter.py's own
      # lookup, PATH-stripping additionally matters for the DLL search).
      # Windows-only: Linux gets its Tcl/Tk from the single apt-installed
      # python3-tk package above (nothing else on that runner to
      # conflict with), and macOS runners have not shown this problem
      # with actions/setup-python's own bundled Tcl/Tk.
      - name: Pin Tcl/Tk to the just-installed Python (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          tcl_dir = pathlib.Path(sys.base_prefix) / "tcl"
          tcl_candidates = sorted(tcl_dir.glob("tcl8.*"))
          tk_candidates = sorted(tcl_dir.glob("tk8.*"))
          if not tcl_candidates or not tk_candidates:
              sys.exit(
                  f"Could not find tcl8.*/tk8.* under {tcl_dir} - has "
                  "actions/setup-python's install layout changed?"
              )
          # Highest version wins if more than one is somehow present -
          # matches what this same interpreter's own _tkinter actually
          # links against.
          tcl_library = tcl_candidates[-1]
          tk_library = tk_candidates[-1]
          print(f"TCL_LIBRARY={tcl_library}")
          print(f"TK_LIBRARY={tk_library}")

          # PATH as inherited here is already the native Windows
          # (semicolon-separated) form - bash.exe reconstructs a native
          # PATH for any child process it spawns (like this python.exe),
          # its own POSIX-style $PATH is internal to bash only. Filtering
          # here and writing the result back to GITHUB_ENV as PATH
          # overrides the value every later step in this job inherits,
          # regardless of which shell that step uses.
          original_path = os.environ.get("PATH", "")
          segments = original_path.split(";")
          kept = [s for s in segments if "strawberry" not in s.lower()]
          removed = [s for s in segments if "strawberry" in s.lower()]
          if removed:
              print("Removing Strawberry Perl from PATH for this job:")
              for s in removed:
                  print(f"  - {s}")
          else:
              print("No Strawberry Perl entries found on PATH (nothing to remove).")
          filtered_path = ";".join(kept)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"TCL_LIBRARY={tcl_library}\n")
              f.write(f"TK_LIBRARY={tk_library}\n")
              f.write(f"PATH={filtered_path}\n")
          PY

      - name: Build bootstrapper executable
        run: >
          pyinstaller --onefile --windowed --name pdf-translator-setup
          ${{ matrix.icon_arg }}
          --add-data "python_runtime${{ matrix.add_data_sep }}python_runtime"
          bootstrap/__main__.py

      # Frozen-binary launch smoke test: starts the actual built
      # executable, gives it a couple of seconds to open its first window
      # without crashing, then kills it - proves the PyInstaller bundle
      # itself (not just the source) is intact, which the "Import smoke
      # check" step above does NOT: it only imports bootstrap.app's
      # source, it never instantiates BootstrapApp(tk.Tk) the way the
      # frozen exe does at startup - exactly the gap that let the
      # Tcl/Tk version-mismatch bug above reach a real release
      # completely undetected by CI (only the Linux leg had this check
      # until now). Linux uses Xvfb (trivial to set up there); Windows
      # runners have a real (if headless) desktop session so the .exe can
      # just be started directly - see the step below. macOS still has no
      # equivalent reliably available, so that platform continues to rely
      # on the import smoke check above plus manual verification of the
      # downloaded artifact.
      - name: Frozen-binary launch smoke test (Linux only)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/pdf-translator-setup &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Bootstrapper exited within 3s of starting - treating as a build failure."
            exit 1
          fi
          kill "$pid"

      # 04.09.2026 - added together with the TCL_LIBRARY/TK_LIBRARY pin
      # above, specifically so a future re-occurrence of that Tcl/Tk
      # mismatch (or any other frozen-exe-only startup crash) fails the
      # CI build instead of only surfacing on a real user's machine after
      # a release is already published.
      #
      # 04.09.2026, revised same day: the check above (HasExited only)
      # turned out to be blind to exactly the crash it was written to
      # catch. A PyInstaller --windowed build installs its own top-level
      # exception handler that, on an unhandled exception such as the
      # Tcl/Tk version-conflict error, shows a "Unhandled exception in
      # script" message-box dialog INSTEAD OF exiting - the process sits
      # there alive, blocked on that dialog, until something closes it.
      # $proc.HasExited was therefore $false on every single run so far,
      # crashed or not: this smoke test has been passing unconditionally
      # since it was added, on both the pre-fix and post-fix builds,
      # which is why the exact same startup crash kept reaching a real
      # Windows VM run after run with CI reporting green the whole time.
      # Checking $proc.MainWindowTitle closes that gap: a healthy start
      # shows the app's own window (whatever ui/i18n_data.py's
      # "app.title" is in the active locale), a crashed start shows only
      # that fixed, non-localised bootloader dialog - so matching on its
      # literal English title reliably tells the two apart.
      - name: Frozen-binary launch smoke test (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\pdf-translator-setup.exe" -PassThru
          Start-Sleep -Seconds 3
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Error "Bootstrapper exited within 3s of starting - treating as a build failure."
            exit 1
          }
          $title = $proc.MainWindowTitle
          Write-Host "Main window title after 3s: '$title'"
          # Two possible crash-dialog titles to watch for: PyInstaller's
          # own generic --windowed handler ("Unhandled exception...",
          # shown for any exception this app does not catch itself), and
          # - since 04.09.2026 - bootstrap/app.py::_report_startup_crash's
          # own, more informative dialog for exceptions raised inside
          # main() specifically (its title is fixed and bilingual, not
          # run through ui/i18n_data.py, so this match is stable
          # regardless of OS locale). Either one means the app failed to
          # reach its own window.
          if ($title -like "Unhandled exception*" -or $title -like "*Fehler beim Start*") {
            Stop-Process -Id $proc.Id -Force
            Write-Error "Bootstrapper crashed at startup - an error dialog was shown ('$title') instead of the app's own window. Treating as a build failure."
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Stage renamed artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/${{ matrix.dist_name }}" "out/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}

  build-source-archive:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 01.09.2026: fails the whole release BEFORE anything is built/
      # published if the pushed tag and _version.py's __version__ disagree -
      # see _version.py's module docstring for why these two must never
      # silently drift apart (bootstrap/release_source.py's self-update
      # check keys off the tag via the GitHub API, ui/app.py compares
      # itself against __version__ - a release where they don't match would
      # either never show up as an update to existing installs, or show up
      # as one forever).
      - name: Verify tag matches _version.py
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(python -c 'from _version import __version__; print(__version__)')"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag v$tag_version does not match _version.py's __version__ ($file_version) - bump _version.py and re-tag."
            exit 1
          fi

      - name: Build app source archive
        run: git archive --format=zip --output=pdf-translator-app-source.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-translator-app-source
          path: pdf-translator-app-source.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-bootstrap, build-source-archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # Both bootstrap/release_source.py::resolve_zip_asset_url()
          # (which grabs the first .zip asset) and a human downloading the
          # right file by name depend on there being exactly one .zip
          # asset per release - keep it that way if this job is ever
          # changed.
          fail_on_unmatched_files: true
